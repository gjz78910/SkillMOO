[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillmoo"
version = "0.1.0"
description = "SkillMOO replication package for ASE 2026 NIER"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pymoo>=0.6.1",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillmoo"]

[tool.ruff]
line-length = 100
target-version = "py310"
